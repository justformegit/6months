<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Приглашение на полгода ❤️</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>

<div class="container" id="quiz-container">
  <h1>Мини-тест о нас 💖</h1>
  <p>Сколько месяцев мы вместе?</p>
  <button onclick="answer(6)">6 месяцев</button>
  <button onclick="answer(5)">5 месяцев</button>
  <button onclick="answer(7)">7 месяцев</button>
</div>

<div class="container hidden" id="invite-container">
  <div class="heart"></div>
  <h1>Полгода вместе! ❤️</h1>
  <p>Приглашаю тебя отпраздновать нашу маленькую, но важную дату!</p>
  <p>Напиши мне😉</p>
</div>


</body>
</html>
